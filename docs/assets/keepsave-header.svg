<text x="155" y="98" font-family="Geist, Inter, system-ui, sans-serif" font-size="42" font-weight="650" fill="#eeecf3">KeepSave</text>
<text x="65" y="187" font-family="Geist, Inter, system-ui, sans-serif" font-size="42" font-weight="600" fill="#eeecf3">Your secrets.</text>
<text x="65" y="241" font-family="Geist, Inter, system-ui, sans-serif" font-size="42" font-weight="600" fill="#d6c9ff">In the right orbit.</text>
<text x="65" y="293" font-family="Geist, Inter, system-ui, sans-serif" font-size="23" fill="#b4aec3">A reliable vault. Controlled developer-tool access.</text>
<text x="65" y="350" font-family="Geist, Inter, system-ui, sans-serif" font-size="16" font-weight="550" letter-spacing="1.6" fill="#4fe3b8">SELF-HOSTED · HARNESS-NEUTRAL · SOURCE CANDIDATE</text>
</svg>
