<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">KeepSave — Container and host boundaries</title>
<desc id="desc">The control host owns vault custody; the separate runner has no database or vault access. Source candidate, reviewed against the October 2 implementation. External acceptance remains pending.</desc>
