<text x="28" y="54" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#928da0" text-anchor="start">KeepSave acts as the identity provider. PKCE, client credentials and refresh token are also supported.</text>
