<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">KeepSave — Delegated MCP authorization</title>
<desc id="desc">KeepSave delegation tokens authorize KeepSave; they are separate from GitHub credentials. Source candidate, reviewed against the October 2 implementation. External acceptance remains pending.</desc>
