{{- if not .Values.secrets.existingSecret }}
# Rendered ONLY when secrets.existingSecret is empty. In production prefer an
# externally-managed Secret (ExternalSecrets/SealedSecrets/SOPS) and set
# .Values.secrets.existingSecret so nothing sensitive is templated into the
# release. See docs/SECRET_SOURCES.md.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
type: Opaque
data:
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  database-url: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- if eq .Values.backend.env.KEEPSAVE_KEY_PROVIDER "env" }}
  master-key: {{ .Values.secrets.masterKey | b64enc | quote }}
  {{- end }}
  {{- if or (eq .Values.backend.env.KEEPSAVE_KEY_PROVIDER "awskms") (eq .Values.backend.env.KEEPSAVE_KEY_PROVIDER "gcpkms") }}
  # KMS-wrapped master key ciphertext consumed via KEEPSAVE_KMS_CIPHERTEXT.
  kms-ciphertext: {{ .Values.secrets.kmsCiphertext | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.backend.env.KEEPSAVE_KEY_PROVIDER "vault" }}
  vault-token: {{ .Values.secrets.vaultToken | b64enc | quote }}
  {{- end }}
{{- end }}
