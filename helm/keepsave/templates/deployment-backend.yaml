{{- /* Secret holding DB/JWT/KMS creds: an externally-managed one if provided,
       else the chart-rendered {{ .Release.Name }}-secrets (see secrets.yaml). */ -}}
{{- $secretName := .Values.secrets.existingSecret | default (printf "%s-secrets" .Release.Name) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: KEEPSAVE_ENV
              value: "{{ .Values.backend.env.KEEPSAVE_ENV }}"
            - name: CORS_ORIGINS
              value: "{{ .Values.backend.env.CORS_ORIGINS }}"
            - name: KEEPSAVE_KEY_PROVIDER
              value: "{{ .Values.backend.env.KEEPSAVE_KEY_PROVIDER }}"
            - name: AUDIT_LOG_RETENTION_DAYS
              value: "{{ .Values.backend.env.AUDIT_LOG_RETENTION_DAYS }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: jwt-secret
            {{- if eq .Values.backend.env.KEEPSAVE_KEY_PROVIDER "env" }}
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: master-key
            {{- end }}
            {{- if eq .Values.backend.env.KEEPSAVE_KEY_PROVIDER "awskms" }}
            - name: KEEPSAVE_KMS_KEY_ID
              value: "{{ .Values.backend.awskms.keyId }}"
            - name: KEEPSAVE_KMS_CIPHERTEXT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: kms-ciphertext
            {{- end }}
            {{- if eq .Values.backend.env.KEEPSAVE_KEY_PROVIDER "gcpkms" }}
            - name: KEEPSAVE_KMS_KEY_ID
              value: "{{ .Values.backend.gcpkms.keyName }}"
            - name: KEEPSAVE_KMS_CIPHERTEXT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: kms-ciphertext
            {{- end }}
            {{- if eq .Values.backend.env.KEEPSAVE_KEY_PROVIDER "vault" }}
            - name: VAULT_ADDR
              value: "{{ .Values.backend.vault.addr }}"
            - name: KEEPSAVE_VAULT_KEY_NAME
              value: "{{ .Values.backend.vault.keyName }}"
            - name: KEEPSAVE_VAULT_CIPHERTEXT
              value: "{{ .Values.backend.vault.ciphertext }}"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: vault-token
            {{- end }}
            {{- if .Values.backend.tls.enabled }}
            - name: TLS_CERT_FILE
              value: "/etc/keepsave/tls/{{ .Values.backend.tls.certFile }}"
            - name: TLS_KEY_FILE
              value: "/etc/keepsave/tls/{{ .Values.backend.tls.keyFile }}"
            - name: TLS_REDIRECT
              value: "{{ .Values.backend.tls.redirect }}"
            - name: TLS_CIPHER_SUITES
              value: "{{ .Values.backend.tls.cipherSuites }}"
            {{- end }}
          volumeMounts:
            # Writable scratch for readOnlyRootFilesystem. The MCP builder writes
            # to /tmp/keepsave-mcp-builds (internal/service/mcp_builder_service.go).
            - name: tmp
              mountPath: /tmp
            {{- if .Values.backend.tls.enabled }}
            - name: tls-certs
              mountPath: /etc/keepsave/tls
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
              scheme: {{ if .Values.backend.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.backend.port }}
              scheme: {{ if .Values.backend.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.backend.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.backend.tls.secretName | default (printf "%s-tls" .Release.Name) }}
        {{- end }}
