# KeepSave Robot Framework e2e harness (API tier).
#
# Mirrors the proven tests/e2e/seidr/docker-compose.yml shape: db + api built
# from source + a runner that exits non-zero on failure. Run with:
#   docker compose -f tests/robot/docker-compose.e2e.yml up \
#     --build --abort-on-container-exit --exit-code-from robot
#
# Process isolation (a dedicated compose + pinned requirements.txt) is what makes
# this "standalone" — no separate repo needed (see tests/robot/README.md).
name: keepsave-robot-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keepsave
      POSTGRES_PASSWORD: keepsave_e2e
      POSTGRES_DB: keepsave
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepsave -d keepsave"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://keepsave:keepsave_e2e@db:5432/keepsave?sslmode=disable
      # Dev-mode master key (base64 of 32 zero bytes). NEVER use in prod.
      MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      KEEPSAVE_KEY_PROVIDER: env
      JWT_SECRET: robot-e2e-jwt-secret-do-not-use-in-prod
      CORS_ORIGINS: "*"
      PORT: "8080"
      KEEPSAVE_ENV: development
      AUDIT_LOG_RETENTION_DAYS: "365"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  robot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      KEEPSAVE_URL: http://api:8080
    volumes:
      - ./results:/suite/results
