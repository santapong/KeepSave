name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default. Jobs override only what they need (INF-2 supply chain).
# See docs/SECRET_SOURCES.md and docs/CI_PERMISSIONS.md.
#
# Every `uses:` below is pinned to a full commit SHA with the human-readable tag
# in a trailing comment, so a moved/compromised tag cannot alter what runs.
# Dependabot (github-actions ecosystem) proposes SHA bumps.
permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25.8'
      - name: Run go vet
        working-directory: ./backend
        run: go vet ./...
      - name: Check formatting
        working-directory: ./backend
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25.8'
      - name: Run tests
        working-directory: ./backend
        # -shuffle=on surfaces test-order dependencies (FLAKY.md §8).
        run: go test -v -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Coverage gate (crypto/auth)
        working-directory: ./backend
        # Ratchet on the security-critical packages so coverage can't regress
        # (WS-11 / PYRAMID.md). Thresholds sit just below current coverage.
        run: |
          set -euo pipefail
          gate() {
            pkg="$1"; min="$2"
            pct=$(go test -cover "$pkg" 2>/dev/null | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')
            echo "$pkg coverage: ${pct:-0}% (min ${min}%)"
            awk -v p="${pct:-0}" -v m="$min" 'BEGIN { exit (p+0 >= m) ? 0 : 1 }' \
              || { echo "::error::$pkg coverage ${pct}% below ${min}%"; exit 1; }
          }
          gate ./internal/crypto 85
          gate ./internal/auth 90
      - name: Fuzz smoke (short)
        working-directory: ./backend
        # Run each fuzz target briefly to catch crashers without a long budget.
        run: |
          set -euo pipefail
          go test ./internal/crypto/  -run=x -fuzz='FuzzEncryptDecryptRoundTrip$' -fuzztime=15s
          go test ./internal/crypto/  -run=x -fuzz='FuzzDecryptNoPanic$'           -fuzztime=15s
          go test ./internal/repository/ -run=x -fuzz='FuzzSplitSQLStatements$'    -fuzztime=15s
          go test ./internal/repository/ -run=x -fuzz='FuzzCanonicalizeJSON$'      -fuzztime=15s
          go test ./internal/api/     -run=x -fuzz='FuzzValidateMCPEntryCommand$'  -fuzztime=15s
      - name: Upload coverage
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: backend-coverage
          path: backend/coverage.out

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25.8'
      - name: Build binary
        working-directory: ./backend
        run: CGO_ENABLED=0 go build -o keepsave-server ./cmd/server

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --reporter=verbose

  frontend-audit:
    name: Frontend npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run npm audit (high+ blocking)
        working-directory: ./frontend
        run: npm audit --audit-level=high

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build

  security-scan:
    name: Security Scan (govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25.8'
      - name: Run govulncheck (blocking)
        working-directory: ./backend
        run: |
          # Pinned version (INF-2): no `@latest` in a security gate.
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          mkdir -p reports
          set -o pipefail
          govulncheck -show verbose ./... 2>&1 | tee reports/govulncheck-report.txt
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: security-report
          path: backend/reports/govulncheck-report.txt
          retention-days: 90

  gosec:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload SARIF to the Security tab. Drop this (and the SARIF steps) if the
      # repo doesn't have GitHub Advanced Security; the gosec run still gates.
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run gosec
        uses: securego/gosec@d4617f51baf75f4f809066386a4f9d27b3ac3e46 # v2.21.4
        with:
          # Scan the Go backend; emit SARIF but do not fail the action on findings
          # there (-no-fail) — the SARIF upload + Security tab is the signal. Flip
          # to a blocking gate by removing `-no-fail` once the baseline is clean.
          args: '-no-fail -fmt sarif -out gosec.sarif ./backend/...'
      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: gosec.sarif
          category: gosec

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          category: "/language:${{ matrix.language }}"

  docker-build:
    name: Docker Build + Scan + SBOM
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, security-scan, frontend-audit, gosec]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # Trivy results are uploaded to the Security tab as SARIF.
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build -t keepsave-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t keepsave-frontend:${{ github.sha }} ./frontend

      # --- Container image vulnerability scan (INF-2): fail on HIGH/CRITICAL ---
      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: keepsave-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: keepsave-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: .
          category: trivy

      # --- SBOM generation (INF-2): Syft SPDX, uploaded as build artifacts ---
      - name: SBOM (backend)
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          image: keepsave-backend:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-backend.spdx.json
          output-file: sbom-backend.spdx.json
      - name: SBOM (frontend)
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          image: keepsave-frontend:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-frontend.spdx.json
          output-file: sbom-frontend.spdx.json
      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sboms
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # SCAFFOLD — NOT YET WIRED. Keyless (OIDC) image signing + SBOM attestation
  # with cosign. This job needs configuration that this repo does not yet have,
  # so it is gated off by default. To enable:
  #   1. Push images to a registry (GHCR/ECR/Artifact Registry) — cosign signs a
  #      pushed digest, not a local `docker build` tag. Add a docker/login +
  #      docker/build-push (push: true) step and capture the image digest.
  #   2. Grant `id-token: write` (already declared) so cosign can mint an OIDC
  #      token for keyless signing against the Fulcio/Rekor public-good infra.
  #   3. Set the `images:` repository + flip `enabled` to a real condition.
  # Tracked as part of INF-2 (WS-9). Until then this never runs (if: false).
  # ---------------------------------------------------------------------------
  cosign-sign:
    name: Sign images + provenance (cosign, OIDC) [SCAFFOLD]
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: false # TODO(WS-9): enable once images are pushed to a registry (see header)
    permissions:
      contents: read
      packages: write      # push to GHCR (adjust for your registry)
      id-token: write      # keyless OIDC signing (REQUIRED by cosign keyless)
    env:
      # TODO: set to the pushed image ref@digest, e.g. ghcr.io/<owner>/keepsave-backend
      IMAGE: ghcr.io/OWNER/keepsave-backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Sign image (keyless)
        run: |
          # Requires the image to already be pushed by digest. Keyless signing
          # uses the workflow's OIDC identity (id-token: write) — no secrets.
          cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"
      - name: Attest SBOM (keyless)
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom-backend.spdx.json "${IMAGE}@${IMAGE_DIGEST}"

  robot-acceptance:
    name: Robot Acceptance (dry-run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dry-run API acceptance suites
        # Parses every API suite and resolves every keyword with no running
        # stack and no HTTP calls. The full docker-compose execution
        # (tests/robot/docker-compose.e2e.yml) is the follow-up once CI has a
        # service stack — see tests/robot/README.md. A venv avoids PEP-668.
        run: |
          python3 -m venv /tmp/rfvenv
          /tmp/rfvenv/bin/pip install -q robotframework==7.4.2 robotframework-requests==0.9.7
          /tmp/rfvenv/bin/robot --dryrun --include api --outputdir tests/robot/results tests/robot/tests
