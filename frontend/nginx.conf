# Self-hosted SPA + reverse-proxy config.
#
# NOT used when deploying to Vercel - vercel.json handles SPA fallback,
# gzip, and asset caching natively, and the backend is reached via
# VITE_API_BASE_URL (see docs/DEPLOYMENT_PLAN.md sec 1, 4.2). This file
# is the Option-C fallback for self-hosting the frontend container behind
# the same origin as the backend.
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # INF (nginx): don't advertise the nginx version in responses/error pages.
    server_tokens off;

    # API reverse proxy to backend
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for long-running operations
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Disable buffering for streaming responses (SSE, etc.)
        proxy_buffering off;

        # Allow large request bodies (icon uploads as base64)
        client_max_body_size 2m;
    }

    # Health check endpoints (no auth)
    location /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Metrics endpoint
    location /metrics {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # OIDC discovery
    location /.well-known/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # FE-F08: Content-Security-Policy + companion security headers.
        # script-src is 'self' only (no unsafe-inline) so injected/3rd-party
        # scripts can't run. style-src allows 'unsafe-inline' because Tailwind
        # and Radix inject inline <style>; font CSS/files come from Google Fonts
        # (see index.html). connect-src is 'self' for this same-origin reverse
        # proxy; if you serve the API from a different origin, append that origin
        # to connect-src.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
