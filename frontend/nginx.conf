# Self-hosted SPA + reverse-proxy config.
#
# NOT used when deploying to Vercel - vercel.json handles SPA fallback,
# gzip, and asset caching natively, and the backend is reached via
# VITE_API_BASE_URL (see docs/DEPLOYMENT_PLAN.md sec 1, 4.2). This file
# is the Option-C fallback for self-hosting the frontend container behind
# the same origin as the backend.
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Hide the nginx version banner (INF nginx finding: server_tokens off).
    server_tokens off;

    # Baseline security headers (INF). `always` so they're emitted on error
    # responses too. Applied at server scope; no `location` here defines its
    # own add_header, so these are not shadowed.
    #
    # NOTE: Content-Security-Policy is intentionally NOT set here. The frontend
    # owns CSP (tracked as FE-F08 / WS-10 in docs/research/IMPROVEMENT_PLAN_2026-06.md);
    # defining it in two places would let them drift. Leave CSP to the app/Vercel.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API reverse proxy to backend
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for long-running operations
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Disable buffering for streaming responses (SSE, etc.)
        proxy_buffering off;

        # Allow large request bodies (icon uploads as base64)
        client_max_body_size 2m;
    }

    # Health check endpoints (no auth)
    location /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Metrics endpoint
    location /metrics {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # OIDC discovery
    location /.well-known/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
