<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>KeepSave — Field Twist</title>
  <desc>Two sweeping light ribbons curl around an open core. An abstract adaptation of the curved polarization pattern in the EHT view of M87.</desc>
  <style>@media (prefers-color-scheme: dark) { .warm-start { stop-color:#e7a566; } .warm-end { stop-color:#ffe2ad; } .cool-start { stop-color:#d6c9ff; } .cool-end { stop-color:#9680dc; } }</style>
  <defs>
