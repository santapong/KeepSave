<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>KeepSave</title>
  <defs>
    <linearGradient id="ks-disk" x1="1" y1="16" x2="31" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c4ddb"/>
      <stop offset=".3" stop-color="#ff5fa8"/>
      <stop offset=".58" stop-color="#ffd08a"/>
      <stop offset=".82" stop-color="#ff5fa8"/>
      <stop offset="1" stop-color="#7c4ddb"/>
    </linearGradient>
  </defs>

  <!-- accretion disk, seen almost edge-on: far half first -->
  <ellipse cx="16" cy="16" rx="14.3" ry="4.7" fill="none" stroke="url(#ks-disk)" stroke-width="2.5"/>

  <!-- the event horizon itself -->
  <circle cx="16" cy="16" r="6.7" fill="#0b0a12"/>
  <circle cx="16" cy="16" r="7.05" fill="none" stroke="#cbb6ff" stroke-width="1.05"/>

  <!-- near half redrawn in front of the core: the lensing read -->
  <path d="M1.7 16A14.3 4.7 0 0 0 30.3 16" fill="none" stroke="url(#ks-disk)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
