        <img src="/keepsave.svg" width="48" height="48" alt="" />
        <h1>KeepSave — a home for your secret keys.</h1>
        <p>Store your application's keys in an encrypted project vault. Give applications and agents access to the environment they need, then review changes before promoting them to production.</p>
        <ol>
          <li><strong>Store:</strong> keep development, testing, and production values separate.</li>
          <li><strong>Scope:</strong> limit a read-only API key to one project and environment.</li>
          <li><strong>Review:</strong> compare changes and configure approvals for production.</li>
        </ol>
        <p>Enable JavaScript to use the interactive walkthrough or sign in.</p>
        <a style="color: #c7b7ff" href="https://github.com/santapong/KeepSave#quick-start">Read the documentation and self-hosting guide →</a>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
